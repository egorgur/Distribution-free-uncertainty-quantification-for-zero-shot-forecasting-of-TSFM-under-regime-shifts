# Синтетика v1: сетка факторов этапа 1 (CLAUDE.md, раздел 7).
# Используется в src/synth.py, src/windows.py, scripts/cache_forecasts.py, scripts/plot_synth.py.
#
# Единица силы σ — стационарное std AR-шума ряда ДО масштабирования (σ = 1).
# Сезонность сверху шума, поэтому полное std ряда больше σ: примерно 1.2–2.3σ.
# Каждой силе weak / medium / strong соответствует одно число в списке.

name: synth_v1
seed: 0
n_per_cell: 10            # независимых рядов на ячейку сетки (класс × тип × сила)

base:                     # ряд до смены; season_period — выбор из списка, остальное — равномерно на [a, b]
  ar_phi: [0.6, 0.8]      # автокорреляция AR(1)-шума
  season_amp: [1.0, 3.0]  # амплитуда сезонности, σ
  season_period: [12, 24, 48]
  log10_scale: [-2, 2]    # итоговый масштаб ряда 10^U(-2, 2): модели должны быть к нему нечувствительны
  offset: [-20, 20]       # итоговый уровень, в единицах масштаба

windows:                  # скользящая оценка (rolling origin): одно окно на каждое d из сетки
  context: 512            # основная длина контекста L
  horizons: [16, 64]
  d_min: -128             # d = t − τ; d < −64 — окна целиком до смены (стабильные)
  d_max: 640              # d ≥ L — старый режим полностью вытеснен из контекста
  d_step: 8

variants:                 # альтернативные контексты окна; конец (момент t) у всех один
  s4_lengths: [256, 128, 64]   # S4: длина в разы меньше L
  s7_tail_k: [-9, -3, 3, 9]    # S7: длина L + k, начало окна сдвигается на k точек
  s7_noise_alpha: 0.1          # S7: шум N(0, (α · std разностей контекста)²)
  s7_noise_draws: 2

# Резкая смена режима в точке τ: параметр меняется скачком.
change:
  mean: [0.5, 1.0, 2.0]          # уровень процесса +kσ; переход идёт через AR-динамику (за несколько шагов)
  variance: [1.5, 2.0, 3.0]      # std шума × k
  trend: [0.5, 1.0, 2.0]         # появляется наклон: +kσ за 64 шага
  ar: [0.2, 0.4, 0.6]            # φ уменьшается на k; std шума сохраняется (это не смена дисперсии)
  seasonality: [0.5, 1.0, 2.0]   # амплитуда сезонности +kσ
  frequency: [1.03, 1.07, 1.25]  # частота сезонности × k; фаза непрерывна (без скачка значения)
  sensor_bias: [0.5, 1.0, 2.0]   # показания +kσ мгновенно, сам процесс не меняется
# Как сильно ряд отличается от того же ряда без смены за 64 шага после τ (RMS, σ; 50 рядов):
#   mean, variance, sensor_bias ≈ 0.5 / 1.0 / 2.0;  frequency 0.5 / 1.0 / 1.9;
#   seasonality 0.35 / 0.7 / 1.4;  trend 0.3 / 0.6 / 1.2;  ar 0.3 / 0.5 / 0.7.
# frequency подобрана под эту шкалу: при ×1.1 / 1.25 / 1.5 даже weak давал 1.35σ.

# Постепенный дрейф: параметр меняется линейно за duration шагов, d отсчитывается от начала дрейфа.
drift:
  duration: 128
  mean: [0.5, 1.0, 2.0]
  frequency: [1.03, 1.07, 1.25]

# Временная аномалия в момент τ, после неё ряд возвращается к прежнему процессу.
anomaly:
  spike: [4.0, 8.0, 16.0]        # одиночный выброс ±kσ
  freeze: [16, 48, 128]          # датчик «залипает» на последнем значении на k точек

# Ряды без изменений: контроль ложных тревог. d для них не определено (NaN).
none: true

models:
  - amazon/chronos-bolt-small
  - amazon/chronos-2
